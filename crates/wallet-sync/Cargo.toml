[package]
name = "wallet-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util"] }
wallet-core = { version = "0.1.0", path = "../wallet-core" }
wallet-store = { version = "0.1.0", path = "../wallet-store" }
